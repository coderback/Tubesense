<!doctype html>
<html lang="en" style="background:#E8EBF6">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tubesense</title>
  <meta name="description" content="GPS-free positioning and a checked evidence pack from ordinary Tube rides. Encode London 2026.">
  <meta name="theme-color" content="#E8EBF6">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tubesense">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <nav class="rail" aria-label="Main">
      <a class="brand" href="#/" aria-label="Tubesense, overview">
        <svg width="44" height="44" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="13" fill="#121735"/><circle cx="20" cy="20" r="9" fill="none" stroke="#FFFFFF" stroke-width="3"/><path d="M8 20h24" stroke="#E1251B" stroke-width="4" stroke-linecap="round"/><circle cx="26" cy="20" r="3.4" fill="#7FA0FF"/></svg>
      </a>
      <div class="nav" id="nav">
        <a class="nav__link" href="#/" data-place="overview" title="Overview"><span class="nav__icon" data-icon="overview"></span><span class="nav__label">Overview</span></a>
        <a class="nav__link" href="#/ride" data-place="ride" title="Ride"><span class="nav__icon" data-icon="ride"></span><span class="nav__label">Ride</span></a>
        <a class="nav__link" href="#/pack" data-place="evidence" title="Evidence"><span class="nav__icon" data-icon="evidence"></span><span class="nav__label">Evidence</span></a>
        <a class="nav__link" href="#/agent" data-place="proof" title="Proof"><span class="nav__icon" data-icon="proof"></span><span class="nav__label">Proof</span></a>
      </div>
      <div class="rail__foot">
        <ul class="status-list" id="status-list" aria-label="Connection status"></ul>
        <a class="rail__demo" href="#/demo" id="demo-btn" title="Start the 3-minute demo" aria-label="Start the 3-minute demo"><span class="nav__icon" data-icon="demo"></span><span class="nav__label">Demo</span></a>
      </div>
    </nav>
    <main class="main" id="main" tabindex="-1">
      <div id="banners"></div>
      <div class="topbar" id="topbar">
        <nav class="subnav" id="subnav" aria-label="Screens in this section"></nav>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <nav class="tabbar" aria-label="Main (phone)" id="tabbar"></nav>
  <div class="sheet" id="sheet" hidden></div>
  <div id="demo-root"></div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-hidden="true"></div>
  <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <noscript><p style="padding:24px;color:#121735">Tubesense needs JavaScript. It has no tracking and no build step.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
